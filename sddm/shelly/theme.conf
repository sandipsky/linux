[General]
; The picture behind everything, relative to this folder or an absolute path that the
; "sddm" user can read (not inside a home folder that is closed to others).
background=background.jpg

; Shelly's [lockscreen] defaults: blur_intensity, tint_intensity, tint_color, and
; [wallpaper] fill_color for what the picture does not cover.
blurIntensity=0.5
tintIntensity=0.3
tintColor="#0B0B0E"
fillColor="#0B0B0E"

; Sizes are in screen pixels, as on the lock screen at a monitor scale of 1. Set this to
; your monitor scale (1.25, 1.5, 2) if the compositor scales the lock screen.
scale=1

; The text font; Shelly follows the system font.
font=Fira Sans

; Shelly's lockscreen.allow_empty_password: let Enter submit an empty password.
allowEmptyPassword=false
